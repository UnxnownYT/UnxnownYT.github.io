<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dyan · Unxnown</title>
<meta name="description" content="dyan, a student in Perth, WA, building apps like Gaze and SakuraCord.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<script>
  // apply a saved theme choice before the page paints, so there's no flash
  try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>

<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<meta property="og:type" content="website">

<meta property="og:title" content="Unxnown · dyan">
<meta property="og:description" content="A student in Perth, WA, building apps like Gaze and SakuraCord.">

<style>
  :root {
    --bg: #ffffff; --fg: #18181b; --muted: #71717a; --soft: #52525b; --faint: #a1a1aa;
    --ring: rgba(228, 228, 231, .6); --tile: #fafafa; --hover: #f4f4f5; --pill: #f4f4f5; --pill-hover: #e4e4e7;
    --spot: rgba(161, 161, 170, .55); --card-edge: rgba(212, 212, 216, .35); --overlay: rgba(255, 255, 255, .45);
    --font: "Geist", ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --soft: #a1a1aa; --faint: #71717a;
    --ring: rgba(63, 63, 70, .5); --tile: #18181b; --hover: #18181b; --pill: #27272a; --pill-hover: #3f3f46;
    --spot: rgba(113, 113, 122, .7); --card-edge: rgba(63, 63, 70, .45); --overlay: rgba(0, 0, 0, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --soft: #a1a1aa; --faint: #71717a;
      --ring: rgba(63, 63, 70, .5); --tile: #18181b; --hover: #18181b; --pill: #27272a; --pill-hover: #3f3f46;
      --spot: rgba(113, 113, 122, .7); --card-edge: rgba(63, 63, 70, .45); --overlay: rgba(0, 0, 0, .45);
    }
  }
  .theming, .theming * { transition: background-color .4s ease, color .4s ease, border-color .4s ease, box-shadow .4s ease !important; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--pill-hover); }

  .page { max-width: 640px; margin: 0 auto; padding: 80px 16px 96px; display: flex; flex-direction: column; min-height: 100vh; }
  main { display: flex; flex-direction: column; gap: 96px; flex: 1; }
  h2 { font-size: 17px; font-weight: 500; margin-bottom: 20px; letter-spacing: -0.01em; }

  /* --- entrance: each section fades up out of a soft blur, one after another --- */
  .rise { opacity: 0; filter: blur(4px); transform: translateY(20px); }
  .ready .rise { opacity: 1; filter: none; transform: none;
    transition: opacity .7s ease, filter .7s ease, transform .9s cubic-bezier(.22, 1, .36, 1); transition-delay: calc(var(--i, 0) * 120ms + 150ms); }

  /* --- header --- */
  header { margin-bottom: 72px; }
  /* name in a cursive font (Snell Roundhand on Macs and iPhones) */
  header .name { display: inline-block; font-family: "Snell Roundhand", "Apple Chancery", "Segoe Script", "Brush Script MT", cursive; font-size: 44px; font-weight: 400; line-height: 1.1; margin-bottom: 6px; }
  header .title { color: var(--soft); }
  .fx span { display: inline-block; opacity: 0; filter: blur(12px); transform: translateY(10px); white-space: pre; }
  .ready .fx span { opacity: 1; filter: none; transform: none;
    transition: opacity .5s ease, filter .5s ease, transform .5s ease; transition-delay: calc(var(--w) * 50ms + 250ms); }

  .intro { color: var(--soft); }
  .intro p + p { margin-top: 14px; }

  /* --- selected projects --- */
  .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .proj-body { padding: 0; }
  .proj-title { position: relative; display: inline-block; font-weight: 400; }
  .proj-title::after { content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 100%; background: var(--fg);
    transform: scaleX(0); transform-origin: left; transition: transform .25s ease; }
  .proj-title:hover::after { transform: scaleX(1); }
  .proj-body p { color: var(--soft); font-size: 14px; }
  .proj-body .note { color: var(--faint); font-size: 13px; margin-top: 4px; }
  .proj-body .note a { color: var(--soft); border-bottom: 1px solid var(--ring); }
  .proj-body .note a:hover { color: var(--fg); border-color: var(--fg); }

  /* --- interests: a highlight that slides between items on hover --- */
  .list { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0 -12px; }
  .list .hl { position: absolute; left: 0; top: 0; border-radius: 12px; background: var(--hover); opacity: 0; pointer-events: none;
    transition: transform .35s cubic-bezier(.22, 1, .36, 1), width .35s cubic-bezier(.22, 1, .36, 1), height .35s cubic-bezier(.22, 1, .36, 1), opacity .25s ease; }
  .list span { position: relative; padding: 10px 12px; }

  /* --- connect --- */
  .connect p { color: var(--soft); }
  .connect p a { color: var(--fg); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .connect p a:hover { text-decoration-color: var(--fg); }
  .socials { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; }
  .mag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-size: 14px;
    background: var(--pill); transition: background-color .2s ease; will-change: transform; }
  .mag:hover { background: var(--pill-hover); }
  .mag svg { width: 12px; height: 12px; }

  /* --- footer --- */
  footer { margin-top: 96px; padding-top: 16px; border-top: 1px solid var(--ring); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .loop { position: relative; height: 1.6em; overflow: hidden; min-width: 160px; }
  .loop span { position: absolute; left: 0; top: 0; white-space: nowrap; transition: transform .5s cubic-bezier(.22, 1, .36, 1), opacity .5s ease, filter .5s ease; }
  .loop span:not(.on) { opacity: 0; transform: translateY(-14px); filter: blur(3px); }
  .loop span.next { transform: translateY(14px); transition: none; }

  .switch { position: relative; display: flex; gap: 2px; padding: 2px; border-radius: 10px; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; border-radius: 8px; background: var(--pill);
    transition: transform .35s cubic-bezier(.22, 1, .36, 1); }
  .switch button { position: relative; width: 28px; height: 28px; border: 0; background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center; border-radius: 8px; }
  .switch button[aria-pressed="true"] { color: var(--fg); }
  .switch svg { width: 15px; height: 15px; }

  @media (max-width: 560px) {
    .page { padding-top: 56px; }
    .projects { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise, .fx span { opacity: 1 !important; filter: none !important; transform: none !important; transition: none !important; }
  }
  @media print { footer .switch { display: none; } .rise, .fx span { opacity: 1; filter: none; transform: none; } }
</style>
</head>
<body>
<!--
  TEMPLATE: edit the CONTENT object in the <script> at the bottom.
  Everything on the page comes from it.
-->
<div class="page">
  <header class="rise" style="--i:0">
    <a class="name" href="/" id="name"></a>
    <div class="title fx" id="title"></div>
  </header>
  <main id="main"></main>
  <footer class="rise" style="--i:5">
    <div class="loop" id="loop"></div>
    <div class="switch" id="switch" role="group" aria-label="Theme">
      <i class="knob"></i>
      <button data-mode="system" aria-label="Match device" title="Match device"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button data-mode="light" aria-label="Light" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button data-mode="dark" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    </div>
  </footer>
</div>

<script>
  /* ============================================================
     CONTENT: everything on the page comes from here.
     ============================================================ */
  const CONTENT = {
    name: "Dyan",
    title: "Student & macOS app developer",
    intro: [
      "Hey! I'm Dyan, a student in Perth, Western Australia. I've worked on three apps: WallX (now discontinued), Gaze, which I co-founded, and my SakuraCord fork for macOS 26.",
      "I started learning to code at 13. I built WallX, but lost the code when the flash drive it was stored on got corrupted. I'm in high school right now and I'm planning to do the IGCSE (International General Certificate of Secondary Education) in Year 10. My parents have been a huge help and have given me lots of support with my learning.",
      "I'm currently working on my SakuraCord fork, keeping it up to date with all the standard updates (including nightlies). I try to release them as fast as I can, but expect delays of about a week, since I'm often busy with school."
    ],
    projects: [
      { title: "Gaze", url: "https://www.gazeunlock.com",
        text: "A Face ID app for Mac that uses the camera in your display to unlock your Mac with your face.",
        note: { before: "Co-founded with", label: "@OwenCope (GitHub)", url: "https://github.com/owencope" } },
      { title: "SakuraCord for macOS 26", url: "https://github.com/UnxnownYT/SakuraCord-macOS-26",
        text: "A native macOS Discord client written in Swift and SwiftUI. My fork gets it working on macOS 26.4 and above.",
        note: { before: "Fork of", label: "SakuraCordApp/SakuraCord on GitHub", url: "https://github.com/SakuraCordApp/SakuraCord" } }
    ],
    interests: ["The aviation industry", "Coding", "Making macOS apps", "SwiftUI", "Xcode", "Visual Studio Code", "Video editing"],
    email: "hi@unxnown.is-a.dev",
    links: [
      { label: "X",       url: "https://x.com/u_nxnown" },
      { label: "GitHub",  url: "https://github.com/UnxnownYT" },
      { label: "YouTube", url: "https://youtube.com/@u_xnown" },
      { label: "Threads", url: "https://www.threads.com/@u_nxnown" }
    ],
    footer: [`© ${new Date().getFullYear()} Dyan.`, "Made by Dyan.", "unxnown.is-a.dev"]
  };

  /* ---------- Render ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ARROW = '<svg viewBox="0 0 15 15" fill="none"><path d="M3.64 11.35 11.35 3.64M5 3.5h6.5V10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  document.getElementById('name').textContent = CONTENT.name;
  document.getElementById('title').innerHTML =
    CONTENT.title.split(/(\s+)/).map((w, i) => `<span style="--w:${i}">${esc(w)}</span>`).join('');

  document.getElementById('main').innerHTML = `
    <section class="intro rise" style="--i:1">${CONTENT.intro.map(p => `<p>${esc(p)}</p>`).join('')}</section>

    <section class="rise" style="--i:2">
      <h2>My Projects</h2>
      <div class="projects">${CONTENT.projects.map(p => `
        <div class="proj-body">
          <a class="proj-title" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
          <p>${esc(p.text)}</p>
          ${p.note ? `<p class="note">${esc(p.note.before)}${p.note.url ? ` <a href="${esc(p.note.url)}" target="_blank" rel="noopener">${esc(p.note.label)}</a>` : ''}</p>` : ''}
        </div>`).join('')}
      </div>
    </section>

    <section class="rise" style="--i:3">
      <h2>Interests</h2>
      <div class="list" id="list"><i class="hl"></i>${CONTENT.interests.map(t => `<span>${esc(t)}</span>`).join('')}</div>
    </section>

    <section class="connect rise" style="--i:4">
      <h2>Connect</h2>
      <p>Feel free to contact me at <a href="mailto:${esc(CONTENT.email)}">${esc(CONTENT.email)}</a></p>
      <div class="socials">${CONTENT.links.map(l => `<a class="mag" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ${ARROW}</a>`).join('')}</div>
    </section>`;

  requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.add('ready')));

  /* ---------- Sliding highlight on interests ---------- */
  (() => {
    const list = document.getElementById('list'), hl = list.querySelector('.hl');
    list.querySelectorAll('span').forEach(s => s.addEventListener('mouseenter', () => {
      const first = hl.style.opacity !== '1';
      if (first) hl.style.transition = 'opacity .25s ease';
      hl.style.width = s.offsetWidth + 'px'; hl.style.height = s.offsetHeight + 'px';
      hl.style.transform = `translate(${s.offsetLeft}px, ${s.offsetTop}px)`;
      hl.style.opacity = '1';
      if (first) requestAnimationFrame(() => hl.style.transition = '');
    }));
    list.addEventListener('mouseleave', () => hl.style.opacity = '0');
  })();

  /* ---------- Magnetic social links ---------- */
  if (matchMedia('(hover: hover)').matches) {
    document.querySelectorAll('.mag').forEach(el => {
      let raf;
      const set = (x, y, slow) => { el.style.transition = `background-color .2s ease, transform ${slow ? '.6s cubic-bezier(.22,1,.36,1)' : '.3s ease-out'}`; el.style.transform = `translate(${x}px, ${y}px)`; };
      addEventListener('mousemove', e => {
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy);
          d < 40 ? set(dx * .05, dy * .05, false) : set(0, 0, true);
        });
      }, { passive: true });
    });
  }

  /* ---------- Footer text loop ---------- */
  (() => {
    const loop = document.getElementById('loop');
    loop.innerHTML = CONTENT.footer.map((t, i) => `<span class="${i ? '' : 'on'}">${esc(t)}</span>`).join('');
    const items = [...loop.children]; let i = 0;
    setInterval(() => {
      const cur = items[i], nxt = items[(i + 1) % items.length];
      nxt.classList.add('next'); nxt.getBoundingClientRect();     // start the next line just below
      nxt.classList.remove('next'); cur.classList.remove('on'); nxt.classList.add('on');
      i = (i + 1) % items.length;
    }, 2600);
  })();

  /* ---------- Theme switch: device / light / dark ---------- */
  (() => {
    const root = document.documentElement, sw = document.getElementById('switch'), knob = sw.querySelector('.knob');
    const buttons = [...sw.querySelectorAll('button')];
    const mode = () => root.dataset.theme || 'system';
    const paint = () => buttons.forEach((b, i) => {
      const on = b.dataset.mode === mode();
      b.setAttribute('aria-pressed', on);
      if (on) knob.style.transform = `translateX(${i * 30}px)`;
    });
    buttons.forEach(b => b.addEventListener('click', () => {
      root.classList.add('theming'); setTimeout(() => root.classList.remove('theming'), 450);
      const m = b.dataset.mode;
      if (m === 'system') { delete root.dataset.theme; try { localStorage.removeItem('theme'); } catch (e) {} }
      else { root.dataset.theme = m; try { localStorage.setItem('theme', m); } catch (e) {} }
      paint();
    }));
    paint();
  })();
</script>
</body>
</html>
