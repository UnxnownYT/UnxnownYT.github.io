<style>
  :root {
    --paper: #f3efe7; --ink: #161514; --muted: #8a847a; --line: #d9d2c5; --accent: #b8432a;
    --body: #3a3733; --soft: #4a4640; --card: #fbf9f4; --shadow: rgba(22, 21, 20, .35);
    --sans: "Helvetica Neue", "Avenir Next", Helvetica, Arial, sans-serif;
  }
  /* Dark mode: follows your Mac/phone setting, unless the toggle overrides it */
  :root[data-theme="dark"] {
    --paper: #151412; --ink: #eeeae2; --muted: #8f897f; --line: #2f2c28; --accent: #e2714f;
    --body: #cdc7bc; --soft: #b5afa5; --card: #1e1c1a; --shadow: rgba(0, 0, 0, .65);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151412; --ink: #eeeae2; --muted: #8f897f; --line: #2f2c28; --accent: #e2714f;
      --body: #cdc7bc; --soft: #b5afa5; --card: #1e1c1a; --shadow: rgba(0, 0, 0, .65);
    }
  }
  /* gentle crossfade when the theme changes */
  .theming, .theming * { transition: background-color .7s ease, color .7s ease, border-color .7s ease, stroke .7s ease, fill .7s ease !important; }
  #pen { fill: var(--ink); }

  .theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 6; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
    display: grid; place-items: center; transition: border-color .3s, transform .5s cubic-bezier(.22,.61,.36,1);
  }
  .theme-toggle:hover { border-color: var(--ink); transform: rotate(180deg); }
  .theme-toggle svg { width: 16px; height: 16px; }
  @media print { .theme-toggle { display: none; } }

  /* "Made by Dyan" corner signature */
  .made { position: fixed; left: 22px; bottom: 18px; z-index: 6; height: 30px; pointer-events: none; opacity: 0; transition: opacity .6s ease; }
  .made.on { opacity: 1; }
  .made svg { height: 100%; width: auto; display: block; overflow: visible; }
  .made path {
    fill: none; stroke: var(--ink); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
    transition: stroke-dashoffset 0s .6s, opacity 0s .6s;   /* resets quietly after fading out */
  }
  .made .m3, .made .m4 { stroke: var(--accent); }
  .made.on path { stroke-dashoffset: 0; opacity: 1; }
  .made.on .m1 { transition: stroke-dashoffset 1.3s cubic-bezier(.45,.05,.55,.95) .2s, opacity 0s .2s; }
  .made.on .m2 { transition: stroke-dashoffset 1s cubic-bezier(.45,.05,.55,.95) 1.6s, opacity 0s 1.6s; }
  .made.on .m3 { transition: stroke-dashoffset .9s cubic-bezier(.45,.05,.55,.95) 2.75s, opacity 0s 2.75s; }
  .made.on .m4 { transition: stroke-dashoffset 1.3s cubic-bezier(.45,.05,.55,.95) 3.7s, opacity 0s 3.7s; }
  @media (max-width: 720px) { .made { height: 24px; left: 16px; } }
  @media (prefers-reduced-motion: reduce) { .made.on path { transition: none; } }
  @media print { .made { display: none; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-weight: 300; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }

  /* ---------- Hero scroll animation ---------- */
  .track { height: 640vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .progress { position: fixed; top: 0; left: 0; height: 2px; width: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); z-index: 5; }

  .script-wrap { position: absolute; left: 50%; top: 50%; width: min(84vw, 760px); will-change: transform; }
  .script { width: 100%; height: auto; display: block; overflow: visible; }
  .script path { fill: none; stroke: var(--ink); stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }

  .word { position: absolute; left: 50%; top: 50%; transform: translateX(-50%); width: clamp(110px, 20vw, 200px); height: auto; overflow: visible; }
  .word path { fill: none; stroke: var(--ink); stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }

  .rule { position: absolute; left: 50%; height: 1px; width: min(36vw, 320px); background: var(--ink); transform: translateX(-50%) scaleX(0); }
  .tag { position: absolute; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 400; letter-spacing: -0.005em; color: var(--muted); opacity: 0; white-space: nowrap; }
  .hint { position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 400; letter-spacing: -0.005em; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .hint i { width: 1px; height: 40px; background: var(--muted); animation: drip 1.8s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); transform-origin: top; } 51% { transform-origin: bottom; } 100% { transform: scaleY(0); transform-origin: bottom; } }

  /* ---------- Biography ---------- */
  .bio { max-width: 980px; margin: 0 auto; padding: 0 28px 120px; }
  .sec { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 32px; padding: 72px 0; border-top: 1px solid var(--line); }
  .sec:first-child { border-top: 0; padding-top: 40px; }
  .label { font-size: 14px; font-weight: 400; letter-spacing: -0.005em; color: var(--muted); padding-top: 6px; }
  .label b { color: var(--ink); font-weight: 400; margin-right: 10px; }

  .lede { font-size: clamp(28px, 4vw, 46px); font-weight: 300; line-height: 1.18; letter-spacing: -0.02em; }
  .lede em { font-style: normal; font-weight: 400; color: var(--accent); }
  /* cursive "dyan" in the opening line: writes itself once the line scrolls into view */
  .name-sig { display: inline-block; height: 1.7em; vertical-align: -0.52em; margin: 0 .04em; }
  .name-sig svg { height: 100%; width: auto; overflow: visible; }
  .name-sig path {
    fill: none; stroke: var(--accent); stroke-width: 7.5; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0;
  }
  .lede.in .name-sig path { stroke-dashoffset: 0; opacity: 1; }
  .lede.in .name-sig .d1 { transition: stroke-dashoffset 1.3s cubic-bezier(.45,.05,.55,.95) .7s, opacity 0s .7s; }
  .lede.in .name-sig .d2 { transition: stroke-dashoffset 2s cubic-bezier(.45,.05,.55,.95) 2.05s, opacity 0s 2.05s; }
  .body { margin-top: 28px; max-width: 58ch; font-size: 17px; line-height: 1.7; color: var(--body); }
  .body p + p { margin-top: 1em; }

  .now { list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
  .now li { border-top: 1px solid var(--ink); padding-top: 16px; }
  .now h3 { font-size: 19px; font-weight: 400; letter-spacing: -0.01em; margin-bottom: 8px; }
  .now p { font-size: 15px; line-height: 1.6; color: var(--soft); }
  .now .credit { margin-top: 12px; font-size: 14px; font-weight: 400; letter-spacing: -0.005em; color: var(--muted); }
  .now .credit a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .now .credit a:hover { text-decoration: underline; }

  /* project titles link out; hovering shows a small window of the site that follows the cursor */
  .now li { position: relative; }
  .now h3 a { text-decoration: none; }
  .now h3 .arrow { display: inline-block; color: var(--muted); font-size: .8em; transition: transform .4s cubic-bezier(.22,.61,.36,1), color .3s; }
  .now h3 a:hover .arrow { transform: translate(2px, -2px); color: var(--accent); }

  .peek {
    position: fixed; left: 0; top: 0; width: 220px; z-index: 20; pointer-events: none; transform-origin: 50% 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    box-shadow: 0 30px 60px -28px var(--shadow);
    opacity: 0; will-change: transform, opacity;
  }
  .peek .bar { display: flex; align-items: center; gap: 4px; padding: 6px 9px; border-bottom: 1px solid var(--line); font-size: 10px; color: var(--muted); }
  .peek .bar i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); flex: none; }
  .peek .bar span { margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peek .view { position: relative; width: 220px; height: 138px; overflow: hidden; background: var(--paper); }
  .peek .view > * { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; }
  .peek .view > .on { opacity: 1; }
  .peek img { width: 100%; height: 100%; inset: auto; left: 0; top: 0; object-fit: cover; object-position: top; }
  /* live site rendered at desktop size, then scaled down to fit */
  .peek iframe { width: 1280px; height: 800px; border: 0; transform: scale(.172); transform-origin: 0 0; inset: auto; left: 0; top: 0; }
  @media (hover: none) { .peek { display: none; } }

  .path { list-style: none; }
  .path li { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 20px; align-items: baseline; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .path li:first-child { padding-top: 0; }
  .path .yr { font-size: 12px; font-weight: 400; letter-spacing: .14em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .path .role { font-size: 20px; font-weight: 400; letter-spacing: -0.01em; }
  .path .where { font-size: 14px; color: var(--muted); }

  .tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tags span { border: 1px solid var(--ink); border-radius: 999px; padding: 8px 16px; font-size: 14px; }

  .contact .big { font-size: clamp(26px, 3.6vw, 40px); font-weight: 300; letter-spacing: -0.02em; text-decoration: none; border-bottom: 1px solid var(--ink); }
  .contact .big:hover { color: var(--accent); border-color: var(--accent); }
  .links { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 28px; font-size: 14px; font-weight: 400; letter-spacing: -0.005em; }
  .links a { text-decoration: none; color: var(--muted); }
  .links a:hover { color: var(--ink); }

  .sign { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 96px; }
  .sign svg { width: 220px; overflow: visible; }
  .sign path { fill: none; stroke: var(--ink); stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; transition: stroke-dashoffset 3.6s cubic-bezier(.45,.05,.55,.95) .3s, opacity 0s .3s; }
  .sign path.cross { transition-duration: .7s, 0s; transition-delay: 3.9s, 3.9s; }
  .sign.in path { stroke-dashoffset: 0; opacity: 1; }
  .sign button { font: inherit; font-size: 14px; font-weight: 400; letter-spacing: -0.005em; color: var(--ink); background: none; border: 1px solid var(--ink); border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: background .2s, color .2s; }
  .sign button:hover { background: var(--ink); color: var(--paper); }

  .r { opacity: 0; transform: translateY(14px); transition: opacity 1.4s cubic-bezier(.25,.1,.25,1), transform 1.6s cubic-bezier(.22,.61,.36,1); transition-delay: calc(var(--i, 0) * 140ms); }
  .r.in { opacity: 1; transform: none; }

  @media (max-width: 720px) {
    .sec { grid-template-columns: minmax(0, 1fr); gap: 20px; padding: 56px 0; }
    .now { grid-template-columns: minmax(0, 1fr); }
    .path li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  }
  @media (prefers-reduced-motion: reduce) { .r { opacity: 1; transform: none; transition: none; } .sign path, .name-sig path { stroke-dashoffset: 0; opacity: 1; transition: none; } }
  @media print {
    .track { height: auto; } .stage { position: relative; } .hint, .progress, .sign button { display: none; }
    .r { opacity: 1; transform: none; } .sign path, .name-sig path { stroke-dashoffset: 0; opacity: 1; } .sec { break-inside: avoid; }
  }
</style>
</head>

<script>
  /* ============================================================
     CONTENT: replace everything in [brackets] with your own details.
     ============================================================ */
  const CONTENT = {
    tagline: "My biography!",
    name: "dyan",
    role: "a student",
    city: "Perth, WA",
    bio: [
      "Hey! I'm dyan, a student in Perth, Western Australia. I've made two apps: WallX (now discontinued) and Gaze, which I co-founded.",
      "I was born on 19th June and started learning to code at 13. I built WallX, but lost the code after someone permanently deleted it from my laptop. I'm in high school right now and I'm planning to do the IGCSE (International General Certificate of Secondary Education) in Year 10. My parents have been a huge help and have given me lots of support with my learning."
    ],
    now: [
      { title: "WallX", url: "https://trywallx.netlify.app",
        text: "A completely free app that lets you use live wallpapers on both your desktop and lock screen.",
        credit: { before: "Now discontinued" },
        // shot: a screenshot of the site. crop: how much of the top to hide (e.g. the browser's toolbar), in %.
        preview: { host: "trywallx.netlify.app", shot: "images/820b69ed.png", crop: 9 } },
      { title: "Gaze", url: "https://www.gazeunlock.com",
        text: "A Face ID app for Mac that uses the camera in your display to unlock your Mac with your face.",
        credit: { before: "Co-founded with", label: "@OwenCope", url: "https://github.com/owencope" },
        preview: { host: "gazeunlock.com", shot: "images/a53a43df.png", crop: 9 } },
      { title: "What I'm into", text: "Graphic design, editing and aviation." }
    ],
    path: [
      { year: "[2024 – now]",  role: "[Role / title]", where: "[Company or place]" },
      { year: "[2021 – 2024]", role: "[Role / title]", where: "[Company or place]" },
      { year: "[2018 – 2021]", role: "[Role / title]", where: "[Company or place]" },
      { year: "[2018]",        role: "[Studied / started]", where: "[School or place]" }
    ],
    interests: ["The aviation industry", "Coding", "Making macOS apps", "Xcode", "Visual Studio Code", "Video editing"],
    email: "hi@unxnown.is-a.dev",
    links: [
      { label: "X",      url: "https://x.com/u_nxnown" },
      { label: "GitHub",  url: "https://github.com/UnxnownYT" },
      { label: "YouTube", url: "https://youtube.com/@u_xnown" },
      { label: "Threads", url: "https://www.threads.com/@u_nxnown" }
    ]
  };

  /* ---------- Render biography ---------- */
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const SIG = document.getElementById('sig').getAttribute('d');
  const CROSS = document.getElementById('cross').getAttribute('d');
  document.getElementById('tag').textContent = CONTENT.tagline;
  document.title = `${CONTENT.name.replace(/[\[\]]/g, '')} · About`;

  document.getElementById('bio').innerHTML = `
    <section class="sec">
      <div class="label r"><b>01</b>Hello</div>
      <div>
        <h1 class="lede r" style="--i:1">I'm <span class="name-sig" role="img" aria-label="${esc(CONTENT.name)}"><svg viewBox="66 15 268 150" aria-hidden="true">
          <!-- hand-drawn cursive "dyan": the d, then "yan" in one joined stroke -->
          <path class="d1" pathLength="1" d="M110 86 C94 78 76 92 78 108 C80 122 100 122 110 104 C116 80 122 40 120 26 C118 60 112 100 116 114 C119 122 128 120 134 110"/>
          <path class="d2" pathLength="1" d="M140 84 C142 100 146 118 160 118 C172 118 180 100 182 82 C182 110 182 140 172 152 C162 164 146 156 152 142 C158 130 180 122 200 112 C210 100 222 82 236 84 C220 78 202 92 204 108 C206 122 226 122 236 104 C238 96 238 86 240 82 C238 98 236 116 246 118 C254 120 260 110 264 100 C268 92 270 86 272 82 C272 96 272 108 272 118 C274 98 284 82 296 82 C308 82 310 96 308 108 C306 118 314 122 326 112"/>
        </svg></span>, ${esc(CONTENT.role)} based in ${esc(CONTENT.city)}.</h1>
        <div class="body">${CONTENT.bio.map((p, i) => `<p class="r" style="--i:${i + 2}">${esc(p)}</p>`).join('')}</div>
      </div>
    </section>

    <section class="sec">
      <div class="label r"><b>02</b>Now</div>
      <ul class="now">${CONTENT.now.map((n, i) => `<li class="r" style="--i:${i + 1}"><h3>${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener"${n.preview ? ` data-peek="${i}"` : ''}>${esc(n.title)} <span class="arrow">↗</span></a>` : esc(n.title)}</h3><p>${esc(n.text)}</p>${n.credit ? `<p class="credit">${esc(n.credit.before)}${n.credit.url ? ` <a href="${esc(n.credit.url)}" target="_blank" rel="noopener">${esc(n.credit.label)} ↗</a>` : ''}</p>` : ''}</li>`).join('')}</ul>
    </section>

    <section class="sec">
      <div class="label r"><b>03</b>Interests</div>
      <div class="tags">${CONTENT.interests.map((c, i) => `<span class="r" style="--i:${i}">${esc(c)}</span>`).join('')}</div>
    </section>

    <section class="sec contact">
      <div class="label r"><b>04</b>Say hi</div>
      <div>
        <a class="big r" style="--i:1" href="mailto:${esc(CONTENT.email)}">${esc(CONTENT.email)}</a>
        <div class="links r" style="--i:2">${CONTENT.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div>
        <div class="sign" id="sign">
          <svg viewBox="20 30 750 190" aria-hidden="true"><path pathLength="1" d="${SIG}"/><path class="cross" pathLength="1" d="${CROSS}"/></svg>
          <button id="replay">Back to top</button>
        </div>
      </div>
    </section>`;

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .2 });
  document.querySelectorAll('.r, #sign').forEach(el => io.observe(el));
  document.getElementById('replay').addEventListener('click', () => scrollTo({ top: 0, behavior: 'smooth' }));

  /* ---------- Site peek: a small window that eases after the cursor ---------- */
  (() => {
    if (!matchMedia('(hover: hover)').matches) return;
    const peek = document.createElement('div');
    peek.className = 'peek'; peek.setAttribute('aria-hidden', 'true');
    peek.innerHTML = '<div class="bar"><i></i><i></i><i></i><span></span></div><div class="view"></div>';
    document.body.appendChild(peek);
    const host = peek.querySelector('.bar span'), view = peek.querySelector('.view');
    const views = {};   // one image or live frame per project, created on first hover

    const mouse = { x: 0, y: 0 }, pos = { x: 0, y: 0 };
    let show = 0, shown = 0, tilt = 0, running = false;

    function viewFor(i) {
      if (views[i]) return views[i];
      const n = CONTENT.now[i];
      let el;
      if (n.preview.shot) {
        el = new Image(); el.src = n.preview.shot; el.alt = '';
        // hide the browser toolbar at the top of the screenshot
        const c = n.preview.crop || 0;
        el.style.top = `-${c}%`; el.style.height = `${100 + c * 1.6}%`;
      }
      else { el = document.createElement('iframe'); el.src = n.url; el.tabIndex = -1; el.setAttribute('loading', 'lazy'); }
      view.appendChild(el);
      return views[i] = el;
    }

    function tick() {
      pos.x += (mouse.x - pos.x) * .14;
      pos.y += (mouse.y - pos.y) * .14;
      shown += (show - shown) * .16;
      tilt += (clamp((mouse.x - pos.x) * .06, -6, 6) - tilt) * .12;   // leans gently in the direction it's moving
      const w = peek.offsetWidth, h = peek.offsetHeight, gap = 22;
      // sit just above the cursor; drop below it if there's no room at the top of the screen
      const above = pos.y - h - gap > 8;
      const x = clamp(pos.x - w / 2, 8, innerWidth - w - 8);
      const y = above ? pos.y - h - gap : pos.y + gap;
      peek.style.transformOrigin = above ? '50% 100%' : '50% 0%';
      peek.style.opacity = shown;
      peek.style.transform =
        `translate(${x}px, ${y}px) translateY(${(1 - shown) * (above ? 10 : -10)}px) scale(${.82 + shown * .18}) rotate(${tilt}deg)`;
      running = shown > .002 || show;
      if (running) requestAnimationFrame(tick);
    }
    const start = () => { if (!running) { running = true; requestAnimationFrame(tick); } };

    addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
    document.querySelectorAll('[data-peek]').forEach(a => {
      a.addEventListener('mouseenter', e => {
        const i = +a.dataset.peek;
        host.textContent = CONTENT.now[i].preview.host;
        Object.values(views).forEach(v => v.classList.remove('on'));
        viewFor(i).classList.add('on');
        if (shown < .05) { pos.x = mouse.x = e.clientX; pos.y = mouse.y = e.clientY; }
        show = 1; start();
      });
      a.addEventListener('mouseleave', () => { show = 0; start(); });
    });
  })();

  /* ---------- Light / dark toggle ---------- */
  const root = document.documentElement;
  const systemDark = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : systemDark.matches;
  const crossfade = () => { root.classList.add('theming'); clearTimeout(crossfade.t); crossfade.t = setTimeout(() => root.classList.remove('theming'), 800); };
  document.getElementById('themeToggle').addEventListener('click', () => {
    crossfade();
    const next = isDark() ? 'light' : 'dark';
    // picking the same as your device setting goes back to following the device
    if ((next === 'dark') === systemDark.matches) { delete root.dataset.theme; try { localStorage.removeItem('theme'); } catch (e) {} }
    else { root.dataset.theme = next; try { localStorage.setItem('theme', next); } catch (e) {} }
  });
  systemDark.addEventListener('change', crossfade);

  /* ---------- Hero scroll animation ---------- */
  const $ = id => document.getElementById(id);
  const track = $('track'), sig = $('sig'), cross = $('cross'), pen = $('pen'), scriptWrap = $('scriptWrap');
  const word = $('word'), strokes = [...word.querySelectorAll('path')];
  const rule = $('rule'), tag = $('tag'), hint = $('hint'), bar = $('progress');

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const seg = (p, a, b) => clamp((p - a) / (b - a));
  const ease = t => -(Math.cos(Math.PI * t) - 1) / 2;   // soft sine in-out
  const out = t => Math.sin(t * Math.PI / 2);           // soft sine out
  const sigLen = sig.getTotalLength();

  function render(p) {
    const vh = innerHeight / 100;
    hint.style.opacity = 1 - seg(p, 0, .05);

    // 1. a dot rests in the centre, glides to where the pen starts, then writes Unxnown in one stroke
    const start = sig.getPointAtLength(0);
    const glide = ease(seg(p, .04, .15));
    const write = ease(seg(p, .15, .44));
    let px = 395 + (start.x - 395) * glide, py = 125 + (start.y - 125) * glide;
    if (write > 0) { const tip = sig.getPointAtLength(sigLen * write); px = tip.x; py = tip.y; }
    pen.setAttribute('cx', px); pen.setAttribute('cy', py);
    pen.style.opacity = write >= 1 ? 0 : 1;
    sig.style.opacity = write > 0 ? 1 : 0;
    sig.style.strokeDashoffset = 1 - write;
    const x = ease(seg(p, .44, .5));   // x is crossed only after the word is written
    cross.style.opacity = x > 0 ? 1 : 0;
    cross.style.strokeDashoffset = 1 - x;

    // 2. it lifts and settles higher up
    const lift = ease(seg(p, .48, .64));
    scriptWrap.style.transform = `translate(-50%, calc(-50% - ${lift * 14 * vh}px)) scale(${1 - lift * .22})`;

    // 3. Dyan draws itself stroke by stroke
    const wordTop = 9 * vh;
    word.style.top = `calc(50% + ${wordTop}px)`;
    strokes.forEach((el, i) => {
      const t = ease(seg(p, .62 + i * .03, .72 + i * .03));
      el.style.opacity = t > 0 ? 1 : 0;
      el.style.strokeDashoffset = 1 - t;
    });

    // 4. hairline and tagline
    const h = word.getBoundingClientRect().height;
    rule.style.top = `calc(50% + ${wordTop + h + 28}px)`;
    rule.style.transform = `translateX(-50%) scaleX(${ease(seg(p, .88, .96))})`;
    const tg = ease(seg(p, .91, 1));
    tag.style.top = `calc(50% + ${wordTop + h + 48}px)`;
    tag.style.opacity = tg;
    tag.style.transform = `translate(-50%, ${(1 - tg) * 8}px)`;
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // The animation eases toward the scroll position instead of snapping to it,
  // so each scroll step glides into the next.
  let target = 0, current = 0, running = false;
  const readScroll = () => {
    const max = track.offsetHeight - innerHeight;
    target = reduced ? 1 : clamp(-track.getBoundingClientRect().top / max);
  };
  function frame() {
    current += (target - current) * 0.075;
    if (Math.abs(target - current) < 0.0004) current = target;
    render(current);
    bar.style.transform = `scaleX(${clamp(scrollY / (document.documentElement.scrollHeight - innerHeight))})`;
    running = current !== target;
    if (running) requestAnimationFrame(frame);
  }
  function update() { readScroll(); if (!running) { running = true; requestAnimationFrame(frame); } }
  addEventListener('scroll', update, { passive: true });
  // show the corner signature once the opening animation has finished
  const made = document.getElementById('made');
  const toggleMade = () => made.classList.toggle('on', track.getBoundingClientRect().bottom < innerHeight * .6);
  addEventListener('scroll', toggleMade, { passive: true });
  toggleMade();
  addEventListener('resize', update);
  matchMedia('print').addEventListener('change', e => e.matches && render(1));
  readScroll(); current = target; render(current); update();
</script>
</body>
</html>
